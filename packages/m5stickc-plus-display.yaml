# Original M5StickC Plus (AXP192), including the user's v1.1; not Plus2.
# Hardware: https://docs.m5stack.com/en/core/m5stickc_plus
# LCD rails: https://github.com/m5stack/M5StickC-Plus/blob/master/src/AXP192.cpp
# Panel offsets: https://github.com/m5stack/M5GFX/blob/master/src/M5GFX.cpp
# Include from a YAML in the project root so assets/Roboto.ttf resolves there.
# Optional LCD module: its only application dependency is charger_bus.snapshot().
# Button, LED and web packages may each be omitted independently.

esphome:
  on_boot:
    # I2C BUS priority is 1000; display setup uses the default DATA priority (600).
    - priority: 850
      then:
        - lambda: |-
            uint8_t rails = 0;
            if (!id(m5stick_axp192).read_byte(0x12, &rails)) {
              ESP_LOGE("m5stick_power", "AXP192 not responding; LCD power was not changed");
              return;
            }
            // M5Stack's original Plus initialization uses 0xCC: LDO2/LDO3 = 3.0 V.
            // Enable only LCD backlight (bit 2) and LCD logic (bit 3), preserving
            // the MCU and other rails. Leave battery-charge registers untouched.
            if (!id(m5stick_axp192).write_byte(0x28, 0xCC) ||
                !id(m5stick_axp192).write_byte(0x12, rails | 0x0C)) {
              ESP_LOGE("m5stick_power", "AXP192 LCD power initialization failed");
              return;
            }
            delay(10);
            id(m5stick_lcd_power_ready) = true;

globals:
  - id: m5stick_lcd_power_ready
    type: bool
    restore_value: false
    initial_value: 'false'

i2c:
  - id: m5stick_internal_i2c
    sda: GPIO21
    scl: GPIO22
    frequency: 100kHz
    scan: false

i2c_device:
  - id: m5stick_axp192
    i2c_id: m5stick_internal_i2c
    address: 0x34

spi:
  - id: m5stick_lcd_spi
    clk_pin: GPIO13
    mosi_pin: GPIO15

font:
  - file: assets/Roboto.ttf
    id: m5stick_font_small
    size: 11
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: assets/Roboto.ttf
    id: m5stick_font_title
    size: 14
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  - file: assets/Roboto.ttf
    id: m5stick_font_value
    size: 40
    glyphs: ' -.0123456789AV'

charger_display:

display:
  - platform: mipi_spi
    id: m5stick_lcd
    model: ST7789V
    spi_id: m5stick_lcd_spi
    cs_pin: GPIO5
    dc_pin: GPIO23
    reset_pin: GPIO18
    dimensions:
      width: 135
      height: 240
      offset_width: 52
      offset_height: 40
      pad_width: 53
      pad_height: 40
    rotation: 270
    invert_colors: true
    # Matches M5GFX Panel_M5StickCPlus: rgb_order=false selects MAD_BGR (0x08).
    color_order: BGR
    color_depth: 16
    buffer_size: 25%
    data_rate: 10MHz
    update_interval: 250ms
    lambda: |-
      using namespace esphome::charger_display;
      const bool display_ready = id(m5stick_lcd_power_ready) && !id(m5stick_lcd).is_failed();
      {
        esphome::charger_event_bus::Event event{esphome::charger_event_bus::EventType::UI_DISPLAY};
        event.source = "lcd";
        event.ui_display_ready = display_ready;
        id(charger_bus).publish(event);
      }
      const auto view = make_view(id(charger_bus).snapshot(), millis());
      it.fill(Color::BLACK);
      for (size_t i = 0; i < view.count; ++i) {
        const auto &label = view.labels[i];
        auto *font = label.font == Font::LARGE ? id(m5stick_font_value) :
            (label.font == Font::MEDIUM ? id(m5stick_font_title) : id(m5stick_font_small));
        const Color ink = label.ink == Ink::WHITE ? Color(255, 255, 255) :
            (label.ink == Ink::GREEN ? Color(64, 230, 140) :
             (label.ink == Ink::AMBER ? Color(255, 185, 64) : Color(160, 160, 160)));
        it.print(label.x, label.y, font, ink,
                 label.right ? TextAlign::TOP_RIGHT : TextAlign::TOP_LEFT,
                 label.text.c_str());
      }
