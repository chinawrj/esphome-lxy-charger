# Optional LED module for original M5StickC Plus (not Plus2).
# Official schematic: LED2 anode=VESP_3V3, cathode=GPIO10, so LOW is on.
# https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/669/k016-p-StickC-Plus-sche.pdf
# Fixed red LED: steady=actual BLE link, slow blink=connecting, off=disabled.
# Reads only event-bus connection snapshots; no other module IDs or result codes.
output:
  - platform: gpio
    id: m5stick_connection_led
    pin:
      number: GPIO10
      inverted: true

charger_indicator:
  id: m5stick_indicator
  event_bus_id: charger_bus
  output_id: m5stick_connection_led
